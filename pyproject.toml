[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kimi-codex-memory"
version = "0.2.0"
description = "An external, failure-isolated Codex memory-v2 pipeline for Kimi Code"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1", "pyinstaller>=6.16,<7"]

[project.scripts]
kimi-memory = "kimi_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kimi_memory = ["prompts/*", "defaults/*", "native/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
