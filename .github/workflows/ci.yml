name: Verify and release native plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Test and build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: linux-x64, arch: x64}
          - {os: ubuntu-24.04-arm, target: linux-arm64, arch: arm64}
          - {os: macos-15-intel, target: darwin-x64, arch: x64}
          - {os: macos-14, target: darwin-arm64, arch: arm64}
          - {os: windows-2022, target: win32-x64, arch: x64}
          - {os: windows-11-arm, target: win32-arm64, arch: arm64}
    env:
      PYTHONUTF8: '1'
      KIMI_CODE_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Install locked build and test dependencies
        run: uv sync --locked --group dev --default-index https://pypi.org/simple
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Rebuild audited authentication bridge
        run: npm run build:auth
      - name: Check bridge reproducibility
        run: git diff --exit-code -- src/kimi_memory/native
      - name: Install test-owned Kimi (never modifies a user installation)
        run: uv run --no-sync python scripts/install-test-kimi.py ${{ matrix.target }}
      - name: Verify sources and contracts
        run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: Build self-contained runtime
        run: uv run --no-sync python scripts/build-plugin.py
      - name: Test relocated plugin without Python or Node on PATH
        run: uv run --no-sync python scripts/smoke-plugin.py dist/plugin
      - name: Create installable platform archive
        run: uv run --no-sync python scripts/archive-plugin.py pack dist/plugin dist/plugin-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-${{ matrix.target }}
          path: dist/plugin-${{ matrix.target }}.zip
          compression-level: 0
          if-no-files-found: error

  assemble:
    name: Assemble universal plugin
    needs: platform
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: plugin-*
          path: platform-artifacts
      - run: python scripts/archive-plugin.py merge platform-artifacts dist/kimi-codex-memory.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kimi-codex-memory-plugin
          path: dist/kimi-codex-memory.zip*
          compression-level: 0

  release:
    name: Publish a new version after all platform checks
    if: github.repository == 'WAcry/kimi-codex-memory' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kimi-codex-memory-plugin
          path: release-assets
      - name: Publish immutable release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version kimi.plugin.json)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; never overwrite published binaries."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Kimi Codex Memory $version" \
            --notes-file CHANGELOG.md release-assets/kimi-codex-memory.zip release-assets/kimi-codex-memory.zip.sha256
